name: App CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  initial-checks:
    name: Initial Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Test frontend
        run: npm test

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python package
        run: python -m pip install -e .

      - name: Install API test dependencies
        run: python -m pip install -e ".[test]"

      - name: Run Python tests
        run: python -m unittest discover -s tests -v

  docker-checks:
    name: Docker Stack
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build and start healthy services
        run: docker compose up --build --wait --wait-timeout 180

      - name: Check frontend, API, PostgreSQL, and Redis
        run: docker compose exec -T api python scripts/docker-smoke.py

      - name: Check API port used by host Apache
        run: curl --fail --silent --show-error http://127.0.0.1:8000/api/health

      - name: Test packaged Python application
        run: docker compose exec -T api python -m unittest discover -s tests -v

      - name: Test packaged frontend
        run: docker compose exec -T web npm test

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=150

      - name: Stop stack and remove disposable CI data
        if: always()
        run: docker compose down --volumes --remove-orphans
