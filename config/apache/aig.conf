# Reference configuration for the existing production Apache virtual hosts.
# The load balancer handles public HTTPS and forwards these hostnames to port 80.
# Update existing vhosts rather than adding duplicate ServerName entries.
<VirtualHost *:80>
    ServerName www.agentstrategy.online
    DocumentRoot /var/www/tca/aig/dist
    <Directory /var/www/tca/aig/dist>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>
    <IfModule headers_module>
        Header always set Cache-Control "no-cache"
    </IfModule>
</VirtualHost>

<VirtualHost *:80>
    ServerName api.agentstrategy.online
    ProxyRequests Off
    ProxyPass / http://127.0.0.1:18080/ connectiontimeout=5 timeout=120
    ProxyPassReverse / http://127.0.0.1:18080/
</VirtualHost>
