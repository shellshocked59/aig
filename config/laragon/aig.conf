# Install as C:/laragon/etc/apache2/sites-enabled/aig.conf.
# Keep the filename free of Laragon's auto. prefix so custom settings survive reloads.
<IfModule !proxy_module>
    LoadModule proxy_module modules/mod_proxy.so
</IfModule>
<IfModule !proxy_http_module>
    LoadModule proxy_http_module modules/mod_proxy_http.so
</IfModule>

<VirtualHost *:80>
    ServerName aig.localhost
    DocumentRoot "C:/code/aig/dist"
    DirectoryIndex index.html

    <Directory "C:/code/aig/dist">
        Options -Indexes
        AllowOverride None
        Require local
    </Directory>

    # Apply local access restrictions to the API as well as static files.
    <Location "/">
        Require local
    </Location>

    ProxyRequests Off
    ProxyPass "/api/" "http://127.0.0.1:8000/api/" connectiontimeout=5 timeout=120
    ProxyPassReverse "/api/" "http://127.0.0.1:8000/api/"

    # Local builds reuse asset names; refresh should always fetch the latest build.
    <IfModule headers_module>
        Header always set Cache-Control "no-store"
    </IfModule>

    # Relative to the active Apache installation's ServerRoot.
    ErrorLog "logs/aig-error.log"
    CustomLog "logs/aig-access.log" combined
</VirtualHost>
