[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "aether-iron-and-glory"
version = "0.0.1"
description = "Python skeleton for the Aether, Iron & Glory strategy experiment"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "openai>=2,<3"]

[project.optional-dependencies]
test = ["httpx2>=2.12,<3", "starlette>=1.2,<2"]
infrastructure = ["psycopg[binary]>=3.2,<4", "redis>=6,<9"]

[tool.setuptools.packages.find]
where = ["backend"]
